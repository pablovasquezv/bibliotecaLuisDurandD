version: '3.8'

services:
  app:
    build: .
    container_name: prevencion-riesgos-app
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/prevenciondb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: example
    depends_on:
      - db

  db:
    image: postgres:14
    container_name: prevencion-riesgos-db
    environment:
      POSTGRES_DB: prevenciondb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: example
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: